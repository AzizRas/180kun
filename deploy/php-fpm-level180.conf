; LEVEL 180 — пул PHP-FPM. Скопируйте в /etc/php/8.3/fpm/pool.d/level180.conf,
; затем: sudo systemctl restart php8.3-fpm

[level180]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm-level180.sock
listen.owner = caddy
listen.group = caddy

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6

php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 16M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 30
php_admin_flag[expose_php] = off

clear_env = no

; Настройки приложения — в /var/www/level180/config.local.php
; (см. config.local.example.php). Один файл и для сайта, и для cron.
